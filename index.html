<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vos tarifs de la semaine</title>
<style>
  :root{
    --green:#1f8a4c; --green-d:#166b3a; --orange:#F57C00; --ink:#1c2b23;
    --line:#e4ebe6; --bg:#f4f7f5; --card:#ffffff; --muted:#6a7b70;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  .head{text-align:center;padding:6px 0}
  .logo{width:108px;height:auto;display:block;margin:0 auto 14px}
  .badge{display:inline-block;background:#e8f4ec;color:var(--green-d);font-weight:700;
    font-size:12px;letter-spacing:.4px;padding:5px 12px;border-radius:999px;text-transform:uppercase}
  h1{font-size:23px;margin:14px 0 6px;line-height:1.25}
  .sub{color:var(--muted);font-size:15px;margin:0 auto;max-width:420px;line-height:1.5}
  .tools{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
  .tools span{font-weight:700;font-size:14px;color:var(--muted)}
  .selall{background:none;border:none;color:var(--green-d);font-weight:700;font-size:14px;
    cursor:pointer;padding:6px 4px}
  .list{display:flex;flex-direction:column;gap:12px}
  label.item{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);
    border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;user-select:none}
  label.item:hover{border-color:#c7ddce}
  label.item.on{border-color:var(--green);box-shadow:0 4px 14px rgba(31,138,76,.14)}
  .icon{width:48px;height:48px;flex:0 0 48px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:26px;line-height:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .meta{flex:1;min-width:0}
  .meta .name{display:block;font-weight:700;font-size:16px}
  .meta .size{display:block;color:var(--muted);font-size:13px;margin-top:4px}
  input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:0 0 24px;
    border:2px solid #c3cec8;border-radius:7px;cursor:pointer;position:relative;background:#fff}
  input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}
  input[type=checkbox]:checked::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;
    border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
  .cta{margin-top:24px}
  .btn{display:block;width:100%;background:var(--orange);color:#fff;border:none;border-radius:14px;
    padding:17px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(245,124,0,.4);
    transition:transform .05s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{background:#c9d3cd;box-shadow:none;cursor:not-allowed}
  .note{margin-top:16px;text-align:center;font-size:14px;min-height:22px}
  .note.ok{color:var(--green-d);font-weight:700}
  .foot{text-align:center;color:#9aa8a0;font-size:12px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img class="logo" src="logo.png" alt="Flying Food">
    <span class="badge">Tarifs Particuliers</span>
    <h1>Vos tarifs de la semaine</h1>
  </div>

  <div class="tools">
    <span id="count">0 sélectionné</span>
    <button class="selall" id="selall" type="button">Tout sélectionner</button>
  </div>

  <div class="list" id="list">
    <label class="item"><span class="icon" style="background:#ffe4e4">🥩</span>
      <span class="meta"><span class="name">Tarifs Viandes</span><span class="size">Excel · 608 Ko</span></span>
      <input type="checkbox" data-id="188GU_RMW5-UCtfUO8OqjHkEh1nJfVFyg"></label>
    <label class="item"><span class="icon" style="background:#fff2d4">🧀</span>
      <span class="meta"><span class="name">Tarifs Fromages</span><span class="size">Excel · 2,6 Mo</span></span>
      <input type="checkbox" data-id="1OXGK1yeyMRFKA4xLHe1E97rJKXS9UOjW"></label>
    <label class="item"><span class="icon" style="background:#e3f5e4">🥦</span>
      <span class="meta"><span class="name">Tarifs Fruits &amp; Légumes</span><span class="size">Excel · 8,8 Mo</span></span>
      <input type="checkbox" data-id="1EknfVO6SUSwUF3ScczW4Tt_1pr-STauV"></label>
    <label class="item"><span class="icon" style="background:#e2f0ff">🐟</span>
      <span class="meta"><span class="name">Tarifs Poissons</span><span class="size">Excel · 2,4 Mo</span></span>
      <input type="checkbox" data-id="1FuJp8qTfqqdQq_RD7vylaprOLndG00kU"></label>
  </div>

  <div class="cta">
    <button class="btn" id="dl" type="button" disabled>Télécharger ma sélection</button>
  </div>
  <div class="foot">Flying Food · Distrimeal</div>
</div>

<script>
  var boxes = Array.prototype.slice.call(document.querySelectorAll('input[type=checkbox]'));
  var dl = document.getElementById('dl');
  var note = document.getElementById('note');
  var count = document.getElementById('count');
  var selall = document.getElementById('selall');

  function refresh(){
    var n = 0;
    boxes.forEach(function(b){
      b.closest('.item').classList.toggle('on', b.checked);
      if(b.checked) n++;
    });
    count.textContent = n + ' sélectionné' + (n>1?'s':'');
    dl.disabled = n === 0;
    dl.textContent = n>1 ? ('Télécharger mes ' + n + ' fichiers') : 'Télécharger ma sélection';
    selall.textContent = (n===boxes.length) ? 'Tout désélectionner' : 'Tout sélectionner';
  }
  boxes.forEach(function(b){ b.addEventListener('change', refresh); });

  selall.addEventListener('click', function(){
    var allOn = boxes.every(function(b){return b.checked;});
    boxes.forEach(function(b){ b.checked = !allOn; });
    refresh();
  });

  function triggerDownload(id, newTab){
    var a = document.createElement('a');
    a.href = 'https://drive.google.com/uc?export=download&id=' + id;
    if(newTab){ a.target = '_blank'; a.rel = 'noopener'; }
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ a.remove(); }, 300);
  }

  dl.addEventListener('click', function(){
    var chosen = boxes.filter(function(b){return b.checked;});
    if(!chosen.length) return;
    if(chosen.length === 1){
      triggerDownload(chosen[0].getAttribute('data-id'), false);
    } else {
      chosen.forEach(function(b, i){
        setTimeout(function(){ triggerDownload(b.getAttribute('data-id'), true); }, i*1200);
      });
    }
  });

  refresh();
</script>
</body>
</html>
