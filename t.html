<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vos tarifs de la semaine</title>
<style>
  :root{
    --ink:#1c2333; --line:#e4e9ef; --bg:#f4f6fa; --card:#fff; --muted:#6a7688;
    --accent:#0092FF; --accent-d:#0072cc;
  }
  body[data-f="excel"]{--accent:#1f8a4c; --accent-d:#166b3a;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  .wrap{max-width:840px;margin:0 auto;padding:20px 16px 48px}
  .head{text-align:center;padding:6px 0}
  .logo{width:108px;height:auto;display:block;margin:0 auto 14px}
  .badge{display:inline-block;background:color-mix(in srgb,var(--accent) 14%,#fff);color:var(--accent-d);
    font-weight:700;font-size:12px;letter-spacing:.4px;padding:5px 12px;border-radius:999px;text-transform:uppercase}
  h1{font-size:23px;margin:14px 0 4px;line-height:1.25}
  .sub{color:var(--muted);font-size:14.5px;margin:0 auto;max-width:430px;line-height:1.5}
  .tools{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
  .tools span{font-weight:700;font-size:14px;color:var(--muted)}
  .selall{background:none;border:none;color:var(--accent-d);font-weight:700;font-size:14px;cursor:pointer;padding:6px 4px}
  .grouphead{display:flex;align-items:center;gap:10px;margin:0 2px 12px;font-weight:800;font-size:13px;
    letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .grouphead::after{content:"";flex:1;height:1px;background:var(--line)}
  .groups{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;align-items:start}
  .group{display:flex;flex-direction:column;gap:12px}
  .single{display:flex;flex-direction:column;gap:12px;max-width:520px;margin:0 auto}
  @media(max-width:600px){ .groups{grid-template-columns:1fr;gap:6px} .group{margin-bottom:8px} }
  label.item{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);
    border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;user-select:none}
  label.item:hover{border-color:color-mix(in srgb,var(--accent) 35%,#fff)}
  label.item.on{border-color:var(--accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 22%,transparent)}
  .icon{width:48px;height:48px;flex:0 0 48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:26px;line-height:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .meta{flex:1;min-width:0}
  .meta .name{display:block;font-weight:700;font-size:16px}
  .meta .size{display:block;color:var(--muted);font-size:13px;margin-top:4px}
  input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:0 0 24px;
    border:2px solid #bcc6d4;border-radius:7px;cursor:pointer;position:relative;background:#fff}
  input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
  input[type=checkbox]:checked::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;
    border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
  .cta{margin-top:24px;position:sticky;bottom:14px}
  .btn{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;
    padding:17px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 40%,transparent);
    transition:transform .05s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{background:#c9d1dc;box-shadow:none;cursor:not-allowed}
  .empty{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;color:var(--muted);font-size:15px}
  .foot{text-align:center;color:#9aa5b5;font-size:12px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img class="logo" src="logo.png" alt="Flying Food">
    <span class="badge" id="badge">Tarifs</span>
    <h1>Vos tarifs de la semaine</h1>
    <p class="sub" id="sub">Cochez ce qu'il vous faut, puis téléchargez. Excel pour commander, PDF pour consulter.</p>
  </div>

  <div class="tools" id="tools" style="display:none">
    <span id="count">0 sélectionné</span>
    <button class="selall" id="selall" type="button">Tout sélectionner</button>
  </div>

  <div class="list" id="list"></div>

  <div class="cta" id="cta" style="display:none">
    <button class="btn" id="dl" type="button" disabled>Télécharger ma sélection</button>
  </div>
  <div class="foot">Flying Food · Distrimeal</div>
</div>

<script>
  // Chaque fichier a un identifiant Drive STABLE (le client met à jour le même fichier chaque semaine).
  var DATA = {
    gms: { label:'GMS',
      excel:[
        {n:'Tarifs Viandes', ic:'🥩', id:'1-lSRMq1N5JV4FH-Apa0ZbtP5A38vgcuS'},
        {n:'Tarifs Poissons', ic:'🐟', id:'1gSHOyHhjemgvN8g5DV669ZD1GGh9XlT6'},
        {n:'Tarifs Fruits & Légumes', ic:'🥦', id:'1oYdgS0dMtQNV6roCXPLr5ugT9thGxdcx'},
        {n:'Tarifs Fromages', ic:'🧀', id:'1_uD43KgyLnKnGbcgrIj-9dsGjOYW5fIt'}
      ],
      pdf:[
        {n:'Tarifs Viandes', ic:'🥩', id:'1522Q70pG6QAYRKe56SDah8CRLPSo0-AY'},
        {n:'Tarifs Poissons', ic:'🐟', id:'1MKChqhCclpINWQKDLoV3dsI-XT9Hs85e'},
        {n:'Tarifs Fruits & Légumes', ic:'🥦', id:'1EVzOUI5TZ7uXVpiEfhfuFcbdnvdcHx4C'},
        {n:'Tarifs Fromages', ic:'🧀', id:'1illJcfIxNwpetaKNsN4n4VBNMO_OBT8R'}
      ] },
    chr: { label:'CHR',
      excel:[
        {n:'Tarifs Viandes', ic:'🥩', id:'1-rqP6ztaEQ2YB-C181Al1bOz8MK6n4O_'},
        {n:'Tarifs Poissons', ic:'🐟', id:'12vYsM8k7JgxeaoWLlBULcwo6Mp3YYuzo'},
        {n:'Tarifs Fruits & Légumes', ic:'🥦', id:'1j2eEEm-JV_8aziZGB3gHWnbg30gPZUvu'},
        {n:'Tarifs Fromages', ic:'🧀', id:'1chWZ3hDfWqqIgGVlyOa71WXLrpPiVkf0'}
      ],
      pdf:[
        {n:'Tarifs Viandes', ic:'🥩', id:'1JgnRLhYMpoRceMnD7Z4hgGc7ScNl9g7C'},
        {n:'Tarifs Poissons', ic:'🐟', id:'1SrEneyIcIggdXfMYDBS01IYJZhGCmfya'},
        {n:'Tarifs Fruits & Légumes', ic:'🥦', id:'1FzvY6c9bDsWgZ7DPbzbxjbkudzR-hEfG'},
        {n:'Tarifs Fromages', ic:'🧀', id:'1Pd5mEZRekaFi8fOf0igRDiISmfIyFFUQ'}
      ] },
    vip: { label:'VIP',
      excel:[],
      pdf:[
        {n:'Tarifs Viandes', ic:'🥩', id:'1Dl85g7Gu17Ze0znEjWPpf_O0sb5pdqg7'},
        {n:'Tarifs Poissons', ic:'🐟', id:'1Bn651F4FiFh8xRlyFbfD5Wha1sPDEhBL'},
        {n:'Tarifs Fruits & Légumes', ic:'🥦', id:'1hbM3YHHvqE0tPf4pa6MmQ4gfs6uLy5HU'},
        {n:'Tarifs Fromages', ic:'🧀', id:'1nkE_teUcdgbr6U7XISqY8rOMtF9oWj_f'}
      ] },
    part: { label:'Particulier',
      excel:[
        {n:'Tarifs Viandes', ic:'🥩', id:'188GU_RMW5-UCtfUO8OqjHkEh1nJfVFyg'},
        {n:'Tarifs Poissons', ic:'🐟', id:'1FuJp8qTfqqdQq_RD7vylaprOLndG00kU'},
        {n:'Tarifs Fruits & Légumes', ic:'🥦', id:'1EknfVO6SUSwUF3ScczW4Tt_1pr-STauV'},
        {n:'Tarifs Fromages', ic:'🧀', id:'1OXGK1yeyMRFKA4xLHe1E97rJKXS9UOjW'}
      ],
      pdf:[
        {n:'Tarifs Viandes', ic:'🥩', id:'1no2UD8jLeK0jZbUdadMOyHZ_ch0DI685'},
        {n:'Tarifs Poissons', ic:'🐟', id:'1OH9XH_Y4O0MrEi1MQSemWGHsW4h27pR_'},
        {n:'Tarifs Fruits & Légumes', ic:'🥦', id:'10dzMY4oLbUv6f-FqjGrZvc4cBbvi6CPR'},
        {n:'Tarifs Fromages', ic:'🧀', id:'1e0gepKDZzR5Y7BPlNCbnvJi0OaQDMLG8'}
      ] }
  };
  var ICONBG = {'🥩':'#ffe4e4','🧀':'#fff2d4','🥦':'#e3f5e4','🐟':'#e2f0ff'};
  var FLBL = {excel:'Excel', pdf:'PDF'};

  function qp(k){ return new URLSearchParams(location.search).get(k); }
  var b = (qp('b')||'').toLowerCase();
  var fParam = (qp('f')||'').toLowerCase();
  var formats = (fParam==='excel'||fParam==='pdf') ? [fParam] : ['excel','pdf'];
  document.body.setAttribute('data-f', formats.length===1 ? formats[0] : 'both');

  var conf = DATA[b];
  document.getElementById('badge').textContent = conf ? ('Tarifs '+conf.label+(formats.length===1?(' · '+FLBL[formats[0]]):'')) : 'Tarifs';
  if(formats.length===1){ document.getElementById('sub').textContent = 'Cochez ce qu’il vous faut, puis téléchargez.'; }

  var list = document.getElementById('list');
  var showHead = formats.length>1;
  var total = 0;
  if(!conf){
    list.innerHTML = '<div class="empty">Lien invalide. Contactez-nous et nous vous renvoyons vos tarifs.</div>';
  } else {
    var container = document.createElement('div');
    container.className = showHead ? 'groups' : 'single';
    list.appendChild(container);
    formats.forEach(function(fm){
      var files = conf[fm]||[];
      if(!files.length){ return; }
      var col = container;
      if(showHead){
        col = document.createElement('div'); col.className='group'; container.appendChild(col);
        var h=document.createElement('div'); h.className='grouphead'; h.textContent='Version '+FLBL[fm]; col.appendChild(h);
      }
      files.forEach(function(x){
        var lab=document.createElement('label'); lab.className='item';
        lab.innerHTML='<span class="icon" style="background:'+(ICONBG[x.ic]||'#eef')+'">'+x.ic+'</span>'+
          '<span class="meta"><span class="name">'+x.n+'</span><span class="size">'+FLBL[fm]+'</span></span>'+
          '<input type="checkbox" data-id="'+x.id+'">';
        col.appendChild(lab); total++;
      });
    });
    if(total===0){ list.innerHTML = '<div class="empty">Ces tarifs ne sont pas encore disponibles ici.<br>Écrivez-nous et on vous les envoie tout de suite.</div>'; }
    else { document.getElementById('tools').style.display=''; document.getElementById('cta').style.display=''; }
  }

  var boxes = Array.prototype.slice.call(document.querySelectorAll('input[type=checkbox]'));
  var dl = document.getElementById('dl');
  var count = document.getElementById('count');
  var selall = document.getElementById('selall');

  function refresh(){
    var n=0;
    boxes.forEach(function(b){ b.closest('.item').classList.toggle('on', b.checked); if(b.checked) n++; });
    count.textContent = n + ' sélectionné' + (n>1?'s':'');
    dl.disabled = n===0;
    dl.textContent = n>1 ? ('Télécharger mes ' + n + ' fichiers') : 'Télécharger ma sélection';
    selall.textContent = (n===boxes.length && n>0) ? 'Tout désélectionner' : 'Tout sélectionner';
  }
  boxes.forEach(function(b){ b.addEventListener('change', refresh); });
  if(selall) selall.addEventListener('click', function(){
    var allOn = boxes.every(function(b){return b.checked;});
    boxes.forEach(function(b){ b.checked = !allOn; });
    refresh();
  });

  function triggerDownload(id, newTab){
    var a=document.createElement('a');
    a.href='https://drive.google.com/uc?export=download&id='+id;
    if(newTab){ a.target='_blank'; a.rel='noopener'; }
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); }, 300);
  }
  if(dl) dl.addEventListener('click', function(){
    var chosen = boxes.filter(function(b){return b.checked;});
    if(!chosen.length) return;
    if(chosen.length===1){ triggerDownload(chosen[0].getAttribute('data-id'), false); }
    else { chosen.forEach(function(b,i){ setTimeout(function(){ triggerDownload(b.getAttribute('data-id'), true); }, i*1200); }); }
  });

  refresh();
</script>
</body>
</html>
